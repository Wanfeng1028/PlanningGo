# docker-compose.prod.yml — 生产环境部署
# 用法: docker compose -f docker-compose.prod.yml up -d
#
# 必须通过 .env 或环境变量提供以下值：
#   POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   COOKIE_SECRET, AMAP_WEB_SERVICE_KEY
# 至少一个 LLM Key（推荐 MIMO_API_KEY 或 QWEN_API_KEY）

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planninggo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: planninggo
    # 生产环境不暴露端口到宿主机，仅通过内部网络访问
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planninggo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://planninggo:${POSTGRES_PASSWORD}@postgres:5432/planninggo?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:?AMAP_WEB_SERVICE_KEY is required}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_FLASH_MODEL: ${QWEN_FLASH_MODEL:-qwen-flash}
      QWEN_PRO_MODEL: ${QWEN_PRO_MODEL:-qwen-plus}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_PROVIDER_PRIORITY: ${LLM_PROVIDER_PRIORITY:-auto}
      LLM_EXPOSE_DIAGNOSTICS: ${LLM_EXPOSE_DIAGNOSTICS:-false}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.mimo.ai/v1}
      MIMO_FLASH_MODEL: ${MIMO_FLASH_MODEL:-}
      MIMO_PRO_MODEL: ${MIMO_PRO_MODEL:-}
      MIMO_SUPPORTS_TOOL_CALLING: ${MIMO_SUPPORTS_TOOL_CALLING:-false}
      PLANNING_MODE: ${PLANNING_MODE:-llm}
      AGENT_CHAT_MODE: ${AGENT_CHAT_MODE:-llm}
      ALLOW_MOCK_PROVIDER_IN_PRODUCTION: ${ALLOW_MOCK_PROVIDER_IN_PRODUCTION:-false}
      AMAP_BASE_URL: ${AMAP_BASE_URL:-https://restapi.amap.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
