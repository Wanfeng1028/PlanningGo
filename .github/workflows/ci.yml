name: CI

on:
  push:
    branches: [main, dev_*]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planninggo
          POSTGRES_PASSWORD: planninggo
          POSTGRES_DB: planninggo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U planninggo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://planninggo:planninggo@localhost:5432/planninggo?schema=public"

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://planninggo:planninggo@localhost:5432/planninggo?schema=public"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://planninggo:planninggo@localhost:5432/planninggo?schema=public"
          REDIS_URL: "redis://localhost:6379/0"
          NODE_ENV: test
          ALLOW_CLIENT_PLAN_FALLBACK: "true"

      - name: Build
        run: npm run build
